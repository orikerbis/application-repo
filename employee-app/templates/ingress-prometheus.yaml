piVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-system-ingress
  namespace: employee-system
  annotations:
spec:
  ingressClassName: nginx
  rules:
  - host: grafana.kerbis.online
    http:
      paths:
      - path: "/"
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.grafana.service.name }}
            port:
              number: {{ .Values.grafana.service.port }}
    