apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "employee-app.fullname" . }}-server
  labels:
    {{- include "employee-app.labels" . | nindent 4 }}
  namespace: employee-system
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "employee-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "employee-app.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}-server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          env:
            - name: MYSQL_HOST
              value: employee-db.ctakwaemi1h6.us-east-2.rds.amazonaws.com
            - name: MYSQL_PASSWORD
              value: "[>Ucq684CtL4Sn(!"          
            - name: MYSQL_USER
              value: admin
          ports:
            - containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: {{ .Values.server.service.port }}
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: {{ .Values.server.service.port }}
          #   initialDelaySeconds: 5
          #   periodSeconds: 10