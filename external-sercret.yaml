apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: employee-system-c
  namespace: employee-system  
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: employee-system-creds
    creationPolicy: Owner
  dataFrom:
  - extract: 
      key: dev/db-credentials
        
   